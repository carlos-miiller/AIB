================================================================================
 §0  CONTRATO DE IMPLEMENTAÇÃO
================================================================================
 OBRIGATÓRIO (decisões já validadas com o usuário; não desviar):
   O1. O orbe fica SEMPRE VISÍVEL sobre todas as janelas (Topmost), no monitor
       PRIMÁRIO, centralizado na horizontal, com a base a 45px ACIMA da barra
       de tarefas. Ver §1 para o cálculo exato.
   O2. Em repouso o orbe é um CÍRCULO com o glyph ✦ e a borda neon. Sem texto,
       sem avatar, sem badge.
   O3. Quando a IA quer falar, o único sinal é o PULSO na borda neon. Nada de
       balão automático, toast ou contador — a fala só aparece quando o
       usuário clica. Ver §5.2 e §8 A5.
   O4. Ao clicar, o orbe MORFA na barra de input e DESAPARECE como círculo —
       não é um painel que abre ao lado. É o mesmo elemento mudando de forma.
       Ver §6.
   O5. Enquanto a IA executa ações em segundo plano, o orbe mostra a TRILHA DE
       ÍCONES das ações concluídas, idêntica à da janela de chat (§4.5).
   O6. NADA de Blur nativo. O "vidro fumê" é cor sólida a 90%.
   O7. A borda neon de 4 paradas é a única cor saturada. Mesma ordem das
       outras telas.
   O8. O orbe NÃO rouba foco do teclado ao aparecer nem ao pulsar. Só ao ser
       clicado, e aí o foco vai para o TextBox. Ver §8 A3.

 LIVRE (escolha da implementação):
   L1. Organização dos ResourceDictionaries.
   L2. Framework MVVM.
   L3. Nomes de classes C#; os de §7 são sugestão.
   L4. Curvas de easing (durações sugeridas, não obrigatórias).
   L5. Como o hit-test da região transparente é resolvido (§8 A2).

================================================================================
 §1  POSICIONAMENTO NA TELA  (leia inteira antes de codar)
================================================================================
 REGRA: monitor primário, centralizado na horizontal, base 45px acima da
 barra de tarefas.

 CÁLCULO
 ------------------------------------------------------------------------------
   var wa   = SystemParameters.WorkArea;         // exclui a barra de tarefas
   var dpi  = VisualTreeHelper.GetDpi(this);     // fator de escala do monitor
   double gap = 45;                              // px lógicos, acima da barra

   Left = wa.Left + (wa.Width - ActualWidth) / 2;
   Top  = wa.Bottom - ActualHeight - gap;

 Usar SystemParameters.WorkArea (e NÃO PrimaryScreenHeight) resolve de graça:
 barra de tarefas em qualquer borda, barra oculta automaticamente, e barras de
 ferramentas de terceiros.

 REPOSICIONAR EM (todos obrigatórios):
   • SystemEvents.DisplaySettingsChanged  — resolução ou monitor trocado
   • SystemParameters.StaticPropertyChanged (WorkArea) — barra escondeu/apareceu
   • DpiChanged                            — janela mudou de monitor/escala
   • SizeChanged do próprio elemento       — o morph muda a largura! §6

 ANCORAGEM DURANTE O MORPH
 ------------------------------------------------------------------------------
 O elemento muda de 56px para ~520px de largura. Se a Window ficar com Left
 fixo, ele cresce só para a direita e sai do centro. Duas saídas:
   (a) Window com largura FIXA de 560px (a maior das duas formas) e o conteúdo
       centralizado dentro dela — o Left nunca muda. RECOMENDADO.
   (b) Recalcular Left a cada frame da animação — funciona, mas treme.
 Este mock usa (a): o palco tem largura fixa e o conteúdo é centralizado.

 MULTI-MONITOR
 ------------------------------------------------------------------------------
 Sempre o monitor PRIMÁRIO (Screen.PrimaryScreen). Se o usuário mover a janela
 de chat para outro monitor, o orbe permanece no primário.

================================================================================
 §4  ESPECIFICAÇÃO POR COMPONENTE
================================================================================

 §4.1  JANELA  (data-spec="window")
 ------------------------------------------------------------------------------
 WindowStyle=None, AllowsTransparency=True, Background=Transparent,
 Topmost=True, ShowInTaskbar=False, ResizeMode=NoResize,
 SizeToContent=Height, Width=560.
 ShowActivated=False — aparecer não pode roubar foco (§0 O8, §8 A3).
 A área transparente da janela precisa ser clicável-através: ver §8 A2.

 §4.2  CASCA QUE MORFA  (data-spec="shell")
 ------------------------------------------------------------------------------
 É o MESMO Border em todos os estados. Só mudam Width, CornerRadius e conteúdo.
   Background     = glass (cor sólida a 90%; §0 O6)
   BorderBrush    = gradiente neon, 1.5px — usar o truque de dois Borders
                    aninhados, igual às janelas (§8 A4)
   Effect         = orbShadow (estado orbe) / barShadow (estado barra)
   Estado orbe    : Width 56, Height 56, CornerRadius 28
   Estado barra   : Width 520, Height 52, CornerRadius 26
 Cursor: Hand no estado orbe; IBeam sobre o TextBox no estado barra.

 §4.3  GLYPH  (data-spec="orb.glyph")
 ------------------------------------------------------------------------------
 "✦" 20px accentLilac, centralizado. No estado barra ele encolhe para 13px e
 migra para a ponta esquerda — é a mesma âncora visual do input da tela de
 chat, o que faz o morph ler como continuidade e não como troca de tela.

 §4.4  HOVER DO ORBE  (data-spec="orb.hover")
 ------------------------------------------------------------------------------
 Scale 1.0 -> 1.06 em 0.15s e a sombra sobe para 0 10px 32px rgba(0,0,0,0.6).
 Sem mudança de cor. WPF: ScaleTransform no VisualState MouseOver.
 Um ToolTip nativo aparece após ~600ms: "Fale com a KAI" (ou o nome ativo).

 §4.8  LISTA DE E-MAILS NO BALÃO  (data-spec="mail-list")
 ------------------------------------------------------------------------------
 Variante do balão de fala (§4.6) usada quando a IA relata o resultado do
 PROCESSING_MAIL (§5.6). Dentro do MESMO Border do balão, abaixo do .sp-text,
 entra uma ItemsControl com um item por e-mail. Nunca um segundo balão.
   ITEM (.mail-item) — Border r12, fundo rgba(255,255,255,0.03), borda
   rgba(255,255,255,0.06), padding 9/11/10/9, gap vertical 6 entre itens.
   Grid de 3 colunas: [3px barra] [conteúdo *] [selo Auto].
     • BARRA de urgência: 3px de largura, altura total do item, r2, cor do
       nível. É o que se lê de relance.
     • NOME 12.5px SemiBold #F5F4F7, uma linha, TextTrimming CharacterEllipsis.
       É o assunto/remetente — não inventar prefixo.
     • DESCRIÇÃO 11.5px #8B8794, line-height 1.45, MÁXIMO 2 LINHAS com
       ellipsis. Resumo gerado pela IA a partir do corpo do e-mail.
     • SELO de urgência (.mail-urg): pílula r999, 10px SemiBold, ponto de 5px +
       rótulo. Máxima #E5484D / Média #E8A33D / Baixa #8B8794, fundo = a mesma
       cor a 13% (Baixa usa branco a 5%).
   Clique no item abre o e-mail no cliente padrão; hover clareia o fundo.
   Mais de 3 e-mails: mostrar os 3 mais urgentes e uma linha final de texto
   "+N outros" — o balão nunca rola.

 §4.5  TRILHA DE ÍCONES  (data-spec="icon-track")
 ------------------------------------------------------------------------------
 IDÊNTICA à da janela de chat (tela-chat-v3.html §4.4). No modo segundo plano
 ela aparece à DIREITA do orbe, dentro de uma cápsula própria que cresce a
 partir dele:
   MaxWidth 142px = 5 × 22px (ícone) + 4 × 8px (gap) — no máximo 5 visíveis
   overflow-x auto, barra horizontal de 4px, thumb rgba(255,255,255,0.18)
   roda vertical do mouse rola na horizontal
   cada ícone reflete a OPERAÇÃO; hover abre o tooltip com o caminho completo
 A cápsula usa a mesma casca do chip do chat: surfaceCard, borda borderCard,
 r18, cardShadow, com um check verde 12px antes da trilha.
 A ação EM CURSO aparece no próprio orbe como anel de progresso (§5.5).

 §4.6  BALÃO DE FALA PROATIVA  (data-spec="speech-card")
 ------------------------------------------------------------------------------
 Só aparece DEPOIS do clique num orbe pulsando (§0 O3). Fica ACIMA da barra,
 com 10px de gap, alinhado pela esquerda dela.
   MaxWidth 440px, padding 14px 16px, r18
   Background surfaceCard, borda 1px borderCard, cardShadow
   Cabeçalho: glyph ✦ 11px accentLilac + nome 12px/600 textStrong +
              hora 10.5px textMuted à direita
   Corpo: 13.5px textBody, line-height 1.5
   Botão de dispensar (X) 22px no canto, textMuted, hover danger
 Entrada: fade + translateY 8px -> 0 em 0.18s.
 Se houver mais de uma fala pendente, empilhar (gap 8px), mais recente embaixo,
 no máximo 3 visíveis.

 §4.7  BARRA DE INPUT  (data-spec="bar")
 ------------------------------------------------------------------------------
 Conteúdo, esquerda -> direita, gap 8px, padding 0 7px 0 16px:
   (a) glyph "✦" 13px accentLilac
   (b) TextBox transparente, 14px textNormal, placeholder "Fale com a KAI..."
       em textMuted. Enter envia; Shift+Enter quebra linha; Esc fecha (§5.3).
   (c) botão MICROFONE 34x34, r8, transparente, textSecondary,
       hover surfaceHoverSoft
   (d) BOTÃO PRIMÁRIO circular 38px, gradiente primary, glow
       0 4px 16px rgba(155,81,224,0.35), ícone de ENVIAR (aviãozinho).
       Estado gravando: quadrado vermelho 13px r3 danger.
       Igual ao da janela de chat — o microfone é botão separado.

================================================================================
 §5  MÁQUINA DE ESTADOS
================================================================================
 Estados mutuamente exclusivos, na propriedade OrbState do ViewModel.

 §5.1  IDLE  (data-spec="state.idle")
 ------------------------------------------------------------------------------
 Orbe 56px, glyph ✦, borda neon estática, orbShadow. Nada mais.
 Transições: clique -> Composing (§5.3) | IA quer falar -> Pulsing |
             IA começa a agir -> Working.

 §5.2  PULSING — a IA quer falar  (data-spec="state.pulsing")
 ------------------------------------------------------------------------------
 O ÚNICO sinal é o pulso; sem balão automático, sem badge, sem som (§0 O3).
 Animação em loop de 2s: um anel expande a partir da borda,
   box-shadow  0 0 0 0 rgba(155,81,224,0.55)  ->  0 0 0 22px rgba(155,81,224,0)
 e a opacidade da borda oscila levemente (1 -> 0.75 -> 1).
 WPF: Storyboard com RepeatBehavior="Forever" animando um Border-anel externo
 (ScaleTransform 1 -> 1.8 + Opacity 0.55 -> 0), não o Effect — animar
 DropShadowEffect por frame é caro. Ver §8 A6.
 O pulso NÃO expira sozinho: continua até o usuário clicar.
 Clique -> Speaking (§5.4).

 §5.3  COMPOSING — input aberto  (data-spec="state.composing")
 ------------------------------------------------------------------------------
 O orbe morfou na barra (§6) e o TextBox está com foco.
 Fechar e voltar a Idle: Esc, clique fora da janela (Deactivated) ou envio da
 mensagem. Ao enviar, a janela de chat completa abre com a mensagem já enviada
 (a conversa continua lá) e o orbe volta para Idle.

 §5.4  SPEAKING — fala revelada  (data-spec="state.speaking")
 ------------------------------------------------------------------------------
 Alcançado clicando um orbe que estava pulsando. Acontecem as duas coisas de
 uma vez: a barra abre (mesmo morph de §6) E o balão de fala aparece acima
 dela (§4.6). O usuário lê e pode responder no mesmo lugar, sem abrir o chat.
 Dispensar o balão (X) mantém a barra aberta.
 Sem pendências restantes, o pulso cessa.

 §5.5  WORKING — executando ações  (data-spec="state.working")
 ------------------------------------------------------------------------------
 O orbe permanece círculo e ganha:
   • ANEL DE PROGRESSO indeterminado ao redor da borda: arco de ~90° em
     accentLilac girando 360° em 0.9s linear infinito (mesma cadência do
     spinner dos chips do chat).
   • O glyph ✦ é substituído pelo ÍCONE DA AÇÃO ATUAL, 23px accentLilac.
   • À direita, a CÁPSULA COM A TRILHA de ícones concluídos (§4.5), que cresce
     a partir do orbe com fade + translateX −8px -> 0 em 0.18s.
 Clicar durante Working abre a barra normalmente; a cápsula permanece visível
 acima dela enquanto a execução continua.
 Ao terminar tudo: a cápsula recolhe após 4s e o orbe volta a Idle (ou a
 Pulsing, se a IA tiver algo a dizer sobre o resultado).

 §5.6  PROCESSING_MAIL — processando e-mails  (data-spec="state.mail")
 ------------------------------------------------------------------------------
 Tarefa periódica em segundo plano: a IA varre a caixa de entrada, classifica e
 resume. Visualmente é o Working (§5.5) com UMA diferença: NÃO há cápsula de
 trilha à direita. Nenhuma ação de filesystem foi executada, então não há o que
 listar — o orbe permanece um círculo de 56px, sozinho.
   • ANEL DE PROGRESSO idêntico ao de Working (arco ~90°, accentLilac, 0.9s
     linear infinito).
   • No centro, o ÍCONE DE INBOX (caixa de entrada) 23px accentLilac no lugar
     do glyph ✦ — mesmo traço 1.5px dos outros ícones.
   • ToolTip: "Processando e-mails".
 Se a varredura gerar ações reais em arquivos (salvar anexo, arquivar), o estado
 passa a Working e a cápsula aparece normalmente.
 Clicar abre a barra (mesmo morph de §6); o anel continua girando no glyph
 pequeno da ponta esquerda enquanto o processamento não termina.
 Ao terminar: volta a Idle, ou a Pulsing se houver algo a relatar
 ("3 e-mails precisam da sua resposta").

 §5.7  SPEAKING / MAIL_REPORT — relatório de e-mails  (data-spec="state.mail-report")
 ------------------------------------------------------------------------------
 Mesmo estado Speaking (§5.4): barra aberta + balão acima. A única diferença é
 o conteúdo do balão — texto de fala normal E, abaixo dele, a lista de e-mails
 (§4.8). Alcançado clicando o orbe pulsando depois de um PROCESSING_MAIL.
 O X dispensa o balão inteiro (lista incluída) e mantém a barra aberta; o
 usuário pode responder por texto ali mesmo ("responde o do jurídico").

================================================================================
 §6  ANIMAÇÃO DE MORPH  (orbe -> barra)
================================================================================
 É o mesmo elemento (§0 O4). Nada aparece "ao lado"; o círculo VIRA a barra.

 Duração total 0.28s, easing CubicEase EaseOut. Em paralelo:
   Width         56  -> 520     (DoubleAnimation)
   Height        56  -> 52
   CornerRadius  28  -> 26      (CornerRadiusAnimation ou um Border com
                                 Height/2 calculado — no WPF puro use
                                 ObjectAnimationUsingKeyFrames ou anime uma
                                 propriedade de dependência custom)
   Effect        orbShadow -> barShadow
 O conteúdo interno faz cross-fade em 0.12s, começando aos 0.10s:
   glyph central 20px  ->  glyph 13px na ponta esquerda
   (fade out do conteúdo do orbe, fade in do conteúdo da barra)
 O foco vai para o TextBox ao FIM da animação, não no início — focar antes faz
 o cursor piscar dentro de um círculo. Ver §8 A7.

 REVERSO (barra -> orbe): mesma animação invertida, 0.22s, EaseIn. O texto
 digitado é DESCARTADO ao fechar por Esc ou clique fora; se houver rascunho
 longo (> 40 caracteres), preservá-lo para a próxima abertura.

 ANCORAGEM: a Window tem largura fixa de 560px e o conteúdo é centralizado
 dentro dela, então o crescimento é simétrico e o Left nunca muda (§1).

================================================================================
 §7  MODELO DE DADOS (ViewModel)
================================================================================
 BackgroundOrbViewModel
   AgentName          : string                  "KAI"
   OrbState           : enum { Idle, Pulsing, Composing, Speaking, Working,
                                  ProcessingMail }
   PendingMessages    : ObservableCollection<ProactiveMessage>
   MailDigest         : ObservableCollection<MailSummary>   -- §4.8
     MailSummary { Name : string; Description : string;
                   Urgency : enum { Maxima, Media, Baixa } }
   Draft              : string                  rascunho preservado
   IsRecording        : bool
   RunningAction      : ToolCall?               ação em curso (ícone do orbe)
   CompletedActions   : ObservableCollection<ToolCall>   trilha (§4.5)
   IsTrackVisible     : bool                    recolhe 4s após terminar

 ProactiveMessage
   Text : string | Timestamp : DateTime | IsDismissed : bool

 ToolCall  — MESMO tipo da janela de chat (tela-chat-v3.html §7)
   Tool, Argument, FullTarget : string
   Kind : enum { Write, Copy, Move, CreateDir, Rename, Read, List, Delete,
                 Command }
   Status : enum { Running, Waiting, Done, Failed }

 COMANDOS
   ActivateCommand        clique no orbe -> Composing ou Speaking
   SendCommand            Enter / botão primário; abre a janela de chat
   DismissSpeechCommand   X do balão
   CollapseCommand        Esc / clique fora -> Idle
   ToggleRecordingCommand microfone
   OpenChatWindowCommand  duplo clique no orbe (atalho para o chat completo)

 MENU DE CONTEXTO (botão direito no orbe) — mínimo viável:
   "Abrir chat" | "Configurações" | "Ocultar por 1 hora" | "Sair"

================================================================================
 §8  MAPA HTML -> XAML, ARMADILHAS E CHECKLIST
================================================================================

 §8.0  MAPA DE CONVERSÃO
 ------------------------------------------------------------------------------
 seletor CSS       | elemento WPF                | observação
 ------------------|-----------------------------|------------------------------
 .desktop/.taskbar | (NÃO IMPLEMENTAR)           | cenário do mock
 .scenarios        | (NÃO IMPLEMENTAR)           | seletor do mock
 .stage            | Grid                        | largura fixa 560, centralizado
 .shell            | Border (o que morfa)        | Width/CornerRadius animados
 .shell.orb        | VisualState "Orb"           | 56x56, r28
 .shell.bar        | VisualState "Bar"           | 520x52, r26
 .pulse-ring       | Border + Storyboard         | Scale+Opacity, não Effect
 .progress-ring    | Path/Arc + RotateTransform  | 0.9s linear infinito
 .action-current   | ContentControl              | ícone da ação OU de inbox
 .track-capsule    | Border + ScrollViewer       | MaxWidth 142
 .action-icon      | Path 22x22 + ToolTip        | Kind -> Geometry
 .speech-card      | Border                      | acima, gap 10
 .mail-list        | ItemsControl                | dentro do balão
 .mail-item        | Border + Grid 3 colunas     | ver §4.8
 .mail-urg         | Border r999 + Ellipse       | Urgency -> Brush
 .bar-input        | TextBox transparente        | PreviewKeyDown
 .send-btn         | Button circular 38          | 2 estados

 Equivalências que costumam confundir:
   gap: Npx           -> Margin nos filhos (WPF não tem gap)
   transform: scale   -> ScaleTransform com RenderTransformOrigin="0.5,0.5"
   box-shadow anel    -> Border extra atrás, com Scale+Opacity animados
   transition         -> Storyboard em VisualStateManager
   position: fixed    -> a própria Window posicionada por §1

 §8.1  ARMADILHAS  (não repetir)
 ------------------------------------------------------------------------------
 A1. PrimaryScreenHeight EM VEZ DE WorkArea. Com a barra de tarefas em cima,
     à esquerda, oculta ou com DPI diferente de 100%, a conta erra. Sempre
     SystemParameters.WorkArea (§1).
 A2. JANELA TRANSPARENTE BLOQUEANDO CLIQUES. Com AllowsTransparency=True, a
     área transparente ainda captura mouse em algumas configurações — o
     usuário não consegue clicar no desktop atrás do orbe. Deixe o Background
     do Grid raiz como {x:Null} (não Transparent) OU aplique
     WS_EX_TRANSPARENT via HwndSource nas regiões vazias.
 A3. ROUBAR FOCO. ShowActivated=False e nunca chamar Activate() ao pulsar. Um
     orbe que rouba o foco enquanto o usuário digita em outro app é motivo
     para desinstalar o programa.
 A4. GRADIENTE COMO BorderBrush. Com CornerRadius o WPF renderiza cantos
     sujos. Usar dois Borders aninhados, como nas outras telas.
 A5. BALÃO AUTOMÁTICO. Foi decidido que a fala NÃO aparece sozinha — só o
     pulso. Um balão que abre por conta própria sobre o trabalho do usuário é
     invasivo. Não "melhorar" isso.
 A6. ANIMAR DropShadowEffect. Animar BlurRadius/Opacity de um Effect por frame
     é caro e engasga. O pulso é um Border-anel com Scale + Opacity.
 A7. FOCAR O TextBox CEDO DEMAIS. Se o foco for dado no início do morph, o
     cursor pisca dentro do círculo. Focar no Completed do Storyboard.
 A8. ORBE CRESCENDO SÓ PARA A DIREITA. Sem a largura fixa da Window (§1), o
     morph desloca o elemento do centro.
 A9. TRILHA DIFERENTE DA DO CHAT. A trilha aqui é a MESMA da janela de chat —
     mesmo tamanho de ícone, mesmo máximo de 5, mesma rolagem. Reaproveite o
     controle, não reimplemente.
 A10. PULSO COM PRAZO. O pulso não some sozinho: some quando o usuário clica.
     Se sumir sozinho, a mensagem se perde.

 A11. LISTA DE E-MAILS ROLÁVEL OU LONGA. O balão mostra no máximo 3 itens e
     nunca rola; o excedente é uma linha de texto "+N outros" (§4.8). Uma
     caixa de entrada inteira flutuando no desktop não é o produto.
 A12. URGÊNCIA SÓ POR COR. A cor é o sinal de relance, mas o rótulo textual
     (Máxima/Média/Baixa) fica junto — daltonismo e captura de tela em tons
     de cinza. Não remover o texto para "limpar" o visual.
 A13. DESCRIÇÃO DO E-MAIL SEM LIMITE. O resumo é gerado pela IA e pode vir
     longo; o TextBlock tem MaxLines=2 + TextTrimming. Sem isso o balão
     estica e cobre a tela do usuário.

 §8.2  CHECKLIST DE ACEITE
 ------------------------------------------------------------------------------
 [ ] Orbe no monitor primário, centralizado, base 45px acima da barra.
 [ ] Reposiciona ao trocar resolução, DPI ou visibilidade da barra.
 [ ] Topmost sobre tudo, sem aparecer na barra de tarefas.
 [ ] Não rouba foco ao aparecer nem ao pulsar.
 [ ] Área transparente deixa clicar no desktop atrás.
 [ ] Repouso: círculo 56px, glyph ✦, borda neon, sem mais nada.
 [ ] Pulso: anel expandindo em loop, sem balão automático.
 [ ] Clique morfa o orbe na barra (mesmo elemento), 0.28s.
 [ ] Foco no TextBox só ao fim da animação.
 [ ] Clique num orbe pulsando abre barra + balão de fala.
 [ ] Working: anel de progresso + ícone da ação + trilha à direita.
 [ ] Trilha idêntica à do chat: 5 ícones, rolagem, tooltip de caminho.
 [ ] Esc / clique fora volta ao orbe.
 [ ] Enter abre a janela de chat com a mensagem enviada.
 [ ] Botão primário = enviar; microfone separado.
 [ ] ProcessingMail: anel de progresso + ícone de inbox, SEM cápsula de trilha.
 [ ] Balão de e-mails: 3 itens, barra de urgência, nome em 1 linha com
     ellipsis, resumo em no máximo 2 linhas, selo com a cor do nível.
 [ ] Clique num item de e-mail abre o e-mail; o balão não rola.
 [ ] Menu de contexto com Abrir chat / Configurações / Ocultar / Sair.
================================================================================
-->

<style>
  /* ==========================================================================
     RESET
     ========================================================================== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  /* ==========================================================================
     CENÁRIO DO MOCK — NÃO IMPLEMENTAR
     Papel de parede + barra de tarefas falsa, só para mostrar o orbe na
     posição real (45px acima da barra, centralizado).
     ========================================================================== */
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: radial-gradient(120% 100% at 30% 0%, #241b3a 0%, #0d0b14 55%, #0a0910 100%);
    overflow: hidden;
  }
  .desktop {
    position: relative;
    height: 100%;
    min-height: 560px;
    display: flex;
    flex-direction: column;
  }
  /* barra de tarefas simulada (Windows 11 ~48px) */
  .taskbar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 48px;
    background: rgba(12, 12, 16, 0.94);
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .taskbar .tb-icon {
    width: 22px; height: 22px;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.10);
  }

  /* ==========================================================================
     §1  PALCO — Window de largura FIXA, centralizada, base 45px acima da barra
     A largura fixa é o que impede o morph de deslocar o elemento (§8 A8).
     ========================================================================== */
  .stage {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 93px;                 /* 48px da barra + 45px de gap */
    width: 560px;                 /* stage.width — maior que a barra (520) */
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  /* ==========================================================================
     §4.6  BALÃO DE FALA PROATIVA — só no estado Speaking
     ========================================================================== */
  .speech-card {
    align-self: flex-start;
    margin-left: 20px;                              /* alinha com a barra */
    max-width: 440px;
    padding: 14px 16px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.035);         /* surfaceCard */
    border: 1px solid rgba(255, 255, 255, 0.08);    /* borderCard */
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.20);      /* cardShadow */
    display: flex;
    flex-direction: column;
    gap: 7px;
    animation: speechIn 0.18s ease-out;
  }
  @keyframes speechIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .sp-head { display: flex; align-items: center; gap: 8px; }
  .sp-glyph { font-size: 11px; color: #C79EF0; }
  .sp-name { font-size: 12px; font-weight: 600; color: #F5F4F7; }
  .sp-time { font-size: 10.5px; color: #6F6A7A; margin-left: auto; }
  .sp-text { font-size: 13.5px; color: #CBC8D1; line-height: 1.5; }
  .sp-close {
    position: absolute;
    top: 10px; right: 10px;
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 6px;
    background: transparent;
    color: #6F6A7A;
    cursor: pointer;
  }
  .sp-close:hover { color: #E5484D; background: rgba(229, 72, 77, 0.14); }
  .speech-card { position: relative; }
  .speech-card .sp-head { padding-right: 26px; }

  /* ==========================================================================
     §4.8  LISTA DE E-MAILS DENTRO DO BALÃO  (data-spec="mail-list")
     Aparece só no Speaking variante e-mails. É uma ItemsControl dentro do
     mesmo Border do balão; NÃO é um segundo balão.
     ========================================================================== */
  .mail-list { display: flex; flex-direction: column; gap: 6px; margin-top: 3px; }
  .mail-item {
    display: grid;
    grid-template-columns: 3px 1fr auto;
    align-items: start;
    column-gap: 10px;
    row-gap: 3px;
    padding: 9px 11px 10px 9px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .mail-item:hover { background: rgba(255, 255, 255, 0.055); border-color: rgba(255,255,255,0.11); }
  .mail-bar { grid-row: 1 / span 2; align-self: stretch; width: 3px; border-radius: 2px; }
  .mail-name {
    grid-column: 2; font-size: 12.5px; font-weight: 600; color: #F5F4F7;
    line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .mail-desc {
    grid-column: 2; grid-row: 2; font-size: 11.5px; color: #8B8794; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .mail-urg {
    grid-column: 3; grid-row: 1;
    display: flex; align-items: center; gap: 5px;
    padding: 3px 8px 3px 6px;
    border-radius: 999px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .mail-urg .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  /* três níveis — a cor É o indicador; o texto é só reforço acessível */
  .u-max  { color: #E5484D; background: rgba(229, 72, 77, 0.13); }
  .u-med  { color: #E8A33D; background: rgba(232, 163, 61, 0.13); }
  .u-low  { color: #8B8794; background: rgba(255, 255, 255, 0.05); }
  .b-max  { background: #E5484D; }
  .b-med  { background: #E8A33D; }
  .b-low  { background: rgba(255, 255, 255, 0.16); }

  /* ==========================================================================
     LINHA DO ORBE — orbe + cápsula da trilha, lado a lado
     ========================================================================== */
  .orb-row { display: flex; align-items: center; gap: 10px; }

  /* ==========================================================================
     §4.2  CASCA QUE MORFA — o MESMO elemento em todos os estados
     Em WPF: um Border só, com Width/CornerRadius animados por VisualState.
     Aqui o gradiente é o fundo + padding de 1.5px (truque de duas camadas).
     ========================================================================== */
  .shell {
    position: relative;
    flex: 0 0 auto;
    padding: 1.5px;                                 /* orb.stroke */
    background: linear-gradient(135deg,
      #9B51E0 0%, #3182CE 35%, #D53F8C 65%, #E28743 100%);   /* neon */
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);     /* orbShadow */
    cursor: pointer;
    transition: width 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                height 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                border-radius 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.28s ease;
  }
  .shell-inner {
    width: 100%; height: 100%;
    background: rgba(18, 18, 22, 0.90);             /* glass — §0 O6 */
    display: flex;
    align-items: center;
    overflow: hidden;
    transition: border-radius 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* --- estado ORBE --- */
  .shell.orb { width: 56px; height: 56px; border-radius: 28px; }
  .shell.orb .shell-inner { border-radius: 26.5px; justify-content: center; }
  /* hover: cresce 6% (§4.4) */
  .shell.orb:hover { transform: scale(1.06); box-shadow: 0 10px 32px rgba(0,0,0,0.60); }
  .shell.orb { transform-origin: center; }

  /* --- estado BARRA --- */
  .shell.bar { width: 520px; height: 52px; border-radius: 26px; cursor: default; }
  .shell.bar .shell-inner { border-radius: 24.5px; padding: 0 7px 0 16px; gap: 8px; }

  /* §4.3 glyph — 20px centralizado no orbe, 13px na ponta da barra */
  .orb-glyph {
    font-size: 20px;
    color: #C79EF0;
    line-height: 1;
    transition: font-size 0.18s ease;
  }
  .shell.bar .orb-glyph { font-size: 13px; }

  /* conteúdo que só existe no estado barra: cross-fade em 0.12s aos 0.10s */
  .bar-only {
    display: none;
    align-items: center;
    gap: 8px;
    flex: 1 1 auto;
    min-width: 0;
    animation: fadeIn 0.12s ease-out 0.10s backwards;
  }
  .shell.bar .bar-only { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* §4.7 campo de texto */
  .bar-input {
    flex: 1 1 auto;
    background: transparent;
    border: none;
    outline: none;
    color: #E8E6EC;                                 /* textNormal */
    font-size: 14px;
    font-family: inherit;
  }
  .bar-input::placeholder { color: #6F6A7A; }       /* textMuted */

  /* botão de ícone (microfone) */
  .icon-btn {
    width: 34px; height: 34px; flex: 0 0 34px;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 8px;
    background: transparent;
    color: #8B8794;
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .icon-btn:hover { background: rgba(255, 255, 255, 0.07); color: #CBC8D1; }

  /* botão primário: ENVIAR (o microfone é separado) */
  .send-btn {
    width: 38px; height: 38px; flex: 0 0 38px;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 50%;
    background: linear-gradient(135deg, #9B51E0, #3182CE);   /* primary */
    box-shadow: 0 4px 16px rgba(155, 81, 224, 0.35);
    cursor: pointer;
  }

  /* ==========================================================================
     §5.2  PULSO — anel expandindo. Em WPF: Border extra com Scale + Opacity,
     NUNCA animando o DropShadowEffect (§8 A6).
     ========================================================================== */
  .pulse-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    pointer-events: none;
    box-shadow: 0 0 0 0 rgba(155, 81, 224, 0.55);
    animation: pulse 2s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(155, 81, 224, 0.55); }
    70%  { box-shadow: 0 0 0 22px rgba(155, 81, 224, 0); }
    100% { box-shadow: 0 0 0 0 rgba(155, 81, 224, 0); }
  }

  /* ==========================================================================
     §5.5  ANEL DE PROGRESSO — arco girando ao redor do orbe
     ========================================================================== */
  .progress-ring {
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: #C79EF0;
    animation: spin 0.9s linear infinite;
    pointer-events: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ícone da ação atual, no lugar do glyph durante Working */
  .action-current { color: #C79EF0; display: flex; }

  /* ==========================================================================
     §4.5  CÁPSULA DA TRILHA — mesma casca do chip do chat
     ========================================================================== */
  .track-capsule {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.035);         /* surfaceCard */
    border: 1px solid rgba(255, 255, 255, 0.08);    /* borderCard */
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.20);      /* cardShadow */
    animation: capsuleIn 0.18s ease-out;
  }
  @keyframes capsuleIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .track-check { width: 12px; height: 12px; flex: 0 0 12px; display: flex; color: #4ADE80; }

  /* trilha: no máximo 5 ícones (142px = 5×22 + 4×8) */
  .icon-track {
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: 142px;
    overflow-x: auto;
    overflow-y: hidden;
  }
  .icon-track::-webkit-scrollbar { height: 4px; }
  .icon-track::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 2px; }

  .action-icon {
    width: 22px; height: 22px; flex: 0 0 22px;
    display: flex; align-items: center; justify-content: center;
    color: #8B8794;
    cursor: default;
    transition: color 0.12s ease;
  }
  .action-icon:hover { color: #CBC8D1; }

  /* tooltip único, fora de qualquer área rolável (mesma regra do chat) */
  .action-tooltip {
    position: fixed;
    padding: 6px 10px;
    border-radius: 8px;
    background: #1D1C24;
    border: 1px solid rgba(155, 81, 224, 0.30);
    color: #CBC8D1;
    font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
    font-size: 11px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s ease;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
    z-index: 100;
  }
  .action-tooltip.on { opacity: 1; }

  a { color: #C79EF0; }
  a:hover { color: #D9BCFF; }

  /* ==========================================================================
     SELETOR DE ESTADOS — NÃO FAZ PARTE DO PRODUTO
     ========================================================================== */
  .scenarios {
    position: absolute;
    top: 24px; left: 24px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
    max-width: 220px;
  }
  .scenarios .tag {
    width: 100%; text-align: left;
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: #6F6A7A; margin-bottom: 2px;
  }
  .scn-btn {
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(255, 255, 255, 0.10);
    color: #8B8794;
    font-size: 12px; font-weight: 600; font-family: inherit;
    padding: 7px 14px; border-radius: 10px;
    cursor: pointer;
    transition: color 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  }
  .scn-btn:hover { color: #CBC8D1; border-color: rgba(255,255,255,0.2); }
  .scn-btn.active {
    color: #FFFFFF;
    background: linear-gradient(135deg, #9B51E0, #3182CE);
    border-color: transparent;
  }
</style>
</head>

/* §4.8 — um item da lista de e-mails do balão */

              med: ['u-med', 'b-med', 'Média'],
              low: ['u-low', 'b-low', 'Baixa'] };
  var m = map[urg];
  return '<span class="mail-item" data-spec="mail-item" data-urgency="' + urg + '">'
    +   '<span class="mail-bar ' + m[1] + '"></span>'
    +   '<span class="mail-name">' + name + '</span>'
    +   '<span class="mail-urg ' + m[0] + '"><span class="dot"></span>' + m[2] + '</span>'
    +   '<span class="mail-desc">' + desc + '</span>'
    + '</span>';
}

const STATES = [

/* ================================================================================
   MONTAGEM DO MOCK
   WPF: a troca de estado é OrbState no ViewModel + VisualStateManager.
   ================================================================================ */
(function () {
  var stage = document.getElementById('stage');
  var bar   = document.getElementById('scenarios');
  var tip   = document.getElementById('actionTooltip');

  function show(i) {
    stage.innerHTML = STATES[i].html;
    Array.prototype.forEach.call(bar.querySelectorAll('.scn-btn'), function (b, j) {
      b.classList.toggle('active', j === i);
    });
  }

  STATES.forEach(function (s, i) {
    var b = document.createElement('button');
    b.className = 'scn-btn';
    b.textContent = s.label;
    b.addEventListener('click', function () { show(i); });
    bar.appendChild(b);
  });

  show(0);

  /* Tooltip das ações concluídas: elemento único, posicionado no hover.
     Mesma regra da janela de chat — nunca filho da trilha rolável. */
  stage.addEventListener('mouseover', function (e) {
    var el = e.target.closest ? e.target.closest('.action-icon[data-tip]') : null;
    if (!el) return;
    tip.innerHTML = el.getAttribute('data-tip');
    tip.classList.add('on');
    var r = el.getBoundingClientRect();
    var w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(Math.max(8, r.left), window.innerWidth - w - 8) + 'px';
    tip.style.top = Math.max(8, r.top - h - 10) + 'px';
  });
  stage.addEventListener('mouseout', function (e) {
    var el = e.target.closest ? e.target.closest('.action-icon[data-tip]') : null;
    if (el) tip.classList.remove('on');
  });

  /* Roda vertical sobre a trilha rola na horizontal (igual ao chat).
     WPF: PreviewMouseWheel somando delta ao HorizontalOffset. */
  stage.addEventListener('wheel', function (e) {
    var track = e.target.closest ? e.target.closest('.icon-track') : null;
    if (!track) return;
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      track.scrollLeft += e.deltaY;
      e.preventDefault();
    }
  }, { passive: false });

  /* §6 — clicar no orbe morfa na barra; Esc volta ao orbe.
     WPF: Storyboard de 0.28s animando Width/Height/CornerRadius; o foco no
     TextBox vai no Completed do Storyboard, nunca no início (§8 A7). */
  stage.addEventListener('click', function (e) {
    var shell = e.target.closest ? e.target.closest('.shell.orb') : null;
    if (!shell) return;
    var pulsing = !!shell.querySelector('.pulse-ring');
    show(pulsing ? 3 : 2);
    setTimeout(function () {
      var input = stage.querySelector('.bar-input');
      if (input) input.focus();
    }, 280);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && stage.querySelector('.shell.bar')) show(0);
  });
})();
</script>
